name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 8 hours, at 17 minutes past the hour
    - cron: "17 */8 * * *"

  # Allows you to test it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create empty keep-awake commit
        run: |
          git config user.name "HAVI Keep-Alive Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep Streamlit app awake"
          git push
